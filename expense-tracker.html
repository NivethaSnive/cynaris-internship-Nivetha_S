
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive expense tracker built with HTML, CSS and JavaScript">
    <title>My Expense Tracker</title>
    <link rel="stylesheet" href="expense-tracker.css">
    <script src="expense-tracker.js" defer></script>
</head>
<body>
    <header class="header">
        <h1>My Expense Tracker</h1>
        <p>Track your spending. Manage your money.</p>
    </header>

    <main class="container">
        <section class="summary">
            <div class="summary-card">
                <h2>Total Expenses</h2>
                <p id="total-expenses">₹0.00</p>
            </div>
            <div class="summary-card">
                <h2>Transactions</h2>
                <p id="transaction-count">0</p>
            </div>
        </section>

        <section class="card">
            <h2>Add an Expense</h2>

            <form id="expense-form">
                <div class="form-group">
                    <label for="expense-name">Expense Name</label>
                    <input
                        type="text"
                        id="expense-name"
                        placeholder="e.g. Lunch"
                        maxlength="80"
                        required>
                </div>

                <div class="form-group">
                    <label for="expense-amount">Amount (₹)</label>
                    <input
                        type="number"
                        id="expense-amount"
                        placeholder="e.g. 150"
                        min="0.01"
                        step="0.01"
                        required>
                </div>

                <div class="form-group">
                    <label for="expense-category">Category</label>
                    <select id="expense-category" required>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Education">Education</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <button type="submit">Add Expense</button>
            </form>

            <p id="form-message" role="status"></p>
        </section>

        <section class="card">
            <h2>Expense History</h2>
            <div id="expense-list">
                <p id="empty-message">No expenses added yet.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Built with HTML, CSS and JavaScript.</p>
    </footer>
</body>
</html>
