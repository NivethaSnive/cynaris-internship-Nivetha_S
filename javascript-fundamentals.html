
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JavaScript functions, promises and API practice">
    <title>JavaScript Fundamentals</title>
    <link rel="stylesheet" href="javascript-fundamentals.css">
    <script src="javascript-fundamentals.js" defer></script>
</head>
<body>
    <header>
        <h1>JavaScript Fundamentals</h1>
        <p>Functions, Promises, Async/Await and Fetch API</p>
    </header>

    <main>
        <section class="card">
            <h2>Function Examples</h2>
            <button id="run-functions">Run 10 Functions</button>
            <pre id="function-output">Click the button to see results.</pre>
        </section>

        <section class="card">
            <h2>Promise Example</h2>
            <button id="promise-button">Fetch User with .then()</button>
            <pre id="promise-output">Click to fetch a user.</pre>
        </section>

        <section class="card">
            <h2>Async/Await Example</h2>
            <button id="async-button">Fetch Posts with async/await</button>
            <div id="posts-output">Click to load posts.</div>
        </section>
    </main>

    <footer>
        <p>Practising modern JavaScript (ES6+)</p>
    </footer>
</body>
</html>
