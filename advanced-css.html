<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Advanced CSS practical tasks">
    <title>Advanced CSS Demo</title>
    <link rel="stylesheet" href="advanced-css.css">
</head>
<body>
    <div class="site">
        <nav class="navbar">
            <a href="#home" class="logo">CSS Studio</a>
            <div class="nav-links">
                <a href="#home">Home</a>
                <a href="#animation">Animations</a>
                <a href="#about">About</a>
            </div>
            <label class="theme-label">
                <input type="checkbox" id="theme-toggle">
                🌙 Dark mode
            </label>
        </nav>

        <main>
            <section id="home" class="hero">
                <h1>Advanced CSS Demo</h1>
                <p>Explore themes, animations and modern CSS effects.</p>
                <a href="#animation" class="button">Explore</a>
            </section>

            <section id="animation" class="card">
                <h2>CSS Loading Spinner</h2>
                <div class="spinner" aria-label="Loading"></div>

                <h2>Progress Bar</h2>
                <div class="progress-track"
                     role="progressbar"
                     aria-label="Progress"
                     aria-valuenow="70"
                     aria-valuemin="0"
                     aria-valuemax="100">
                    <div class="progress-fill"></div>
                </div>
            </section>

            <section id="about" class="card decorative">
                <h2>CSS Pseudo-elements</h2>
                <p>This card uses ::before and ::after for decoration.</p>
                <p>Scroll smoothly using the navigation links.</p>
            </section>
        </main>

        <footer>Built with HTML and CSS only.</footer>
    </div>
</body>
</html>
